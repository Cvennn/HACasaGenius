# Integration Quality Scale — Swegon CASA Genius
# Target: Silver
# Source: https://developers.home-assistant.io/docs/core/integration-quality-scale/
# Rules fetched from: homeassistant/core/dev/script/hassfest/quality_scale.py

rules:

  # BRONZE
  action-setup:
    status: exempt
    comment:
      Integration does not register any custom HA actions/services.
      Device control is handled through standard entity platforms
      (select, number, switch).

  appropriate-polling:
    status: done
    comment:
     integration uses local_polling

  brands:
    status: done
    comment:
      Integration ships with a brand icon in the integration package and
      declares its ownership metadata in the manifest.

  common-modules:
    status: done

  config-flow:
    status: done

  config-flow-tests:
    status: done

  dependency-transparency:
    status: done

  docs-actions:
    status: exempt
    comment:
      No custom HA actions registered. Standard entity services
      (select.select_option, number.set_value, switch.turn_on/off)
      are documented by HA core.

  docs-high-level-description:
    status: done

  docs-installation-instructions:
    status: done

  docs-removal-instructions:
    status: done

  entity-event-setup:
    status: exempt
    comment:
      Integration uses DataUpdateCoordinator polling exclusively.
      No push events or subscriptions are used.

  entity-unique-id:
    status: done

  has-entity-name:
    status: done

  runtime-data:
    status: done

  test-before-configure:
    status: done

  test-before-setup:
    status: done

  unique-config-entry:
    status: done

  # SILVER — target level
  action-exceptions:
    status: exempt
    comment:
     No custom actions registered. Not applicable.

  config-entry-unloading:
    status: done

  docs-configuration-parameters:
    status: done

  docs-installation-parameters:
    status: done

  entity-unavailable:
    status: done

  integration-owner:
    status: done
    comment:
      The integration declares a code owner in the manifest and is maintained
      in the repository.

  log-when-unavailable:
    status: done

  parallel-updates:
    status: done
    comment:
      Each platform module declares PARALLEL_UPDATES = 1 to prevent
      concurrent Modbus traffic on the same serial bus.

  reauthentication-flow:
    status: exempt
    comment:
      Modbus RTU protocol has no authentication, credentials, or tokens.
      The physical serial connection either works or it does not.

  test-coverage:
    status: done
    comment:
      Automated tests cover the config flow success and failure paths as well
      as regression checks for platform parallel-update declarations.
